[package]
name = "timemark"
version = "0.1.1"
description = "TimeMark native package application"
authors = ["TimeMark"]
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-auth-session = { git = "https://github.com/yanqianglu/tauri-plugin-auth-session", rev = "b335cfff0662d04e468df8e32869c047e6400135" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3.2", features = ["UIApplication", "block2"] }
